<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>BDU Market · Mini App</title>
  <!-- Tailwind via CDN + custom smooth style -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #f5f7fb; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .glass-card { background: rgba(255,255,255,0.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.3); }
    .product-card { transition: all 0.15s ease; }
    .product-card:active { transform: scale(0.97); }
    .modal-backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); }
    .order-btn { background: #0088cc; }
    .order-btn:hover { background: #006699; }
    .lang-btn { background: #1e293b; color: white; }
    .admin-badge { background: #b45309; color: white; font-size: 0.65rem; padding: 2px 10px; border-radius: 30px; }
    /* RTL support for Amharic */
    [dir="rtl"] { text-align: right; }
    [dir="rtl"] .flex-row { flex-direction: row-reverse; }
    img { object-fit: cover; }
  </style>
</head>
<body class="p-3 max-w-md mx-auto min-h-screen relative">

  <!-- MAIN APP -->
  <div id="app" class="space-y-4 pb-24">
    <!-- Header with language toggle -->
    <div class="flex justify-between items-center pt-1">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-bold text-indigo-800">🎓 BDU</span>
        <span class="text-sm text-gray-600 font-medium" id="headerSub">Market</span>
      </div>
      <div class="flex gap-2 items-center">
        <button id="langToggle" class="lang-btn px-3 py-1.5 rounded-full text-sm flex items-center gap-1 shadow-sm">
          <i class="fas fa-globe-africa"></i> <span id="langLabel">አማርኛ</span>
        </button>
        <button id="adminOpenBtn" class="bg-gray-200 hover:bg-gray-300 p-2 rounded-full text-gray-700">
          <i class="fas fa-user-cog"></i>
        </button>
      </div>
    </div>

    <!-- Category filter chips -->
    <div class="flex flex-wrap gap-2 py-1" id="categoryFilter">
      <button data-cat="all" class="cat-btn bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium">All</button>
      <button data-cat="Educational" class="cat-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium">📚 Educational</button>
      <button data-cat="Cosmetics" class="cat-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium">💄 Cosmetics</button>
      <button data-cat="Electronics" class="cat-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium">📱 Electronics</button>
    </div>

    <!-- Product grid -->
    <div id="productGrid" class="grid grid-cols-2 gap-3">
      <!-- rendered by JS -->
    </div>
  </div>

  <!-- PRODUCT DETAIL MODAL (rating + order) -->
  <div id="detailModal" class="fixed inset-0 z-50 flex items-end justify-center modal-backdrop hidden" style="background: rgba(0,0,0,0.5);">
    <div class="bg-white w-full max-w-md rounded-t-3xl p-5 max-h-[90vh] overflow-y-auto animate-[slideUp_0.2s_ease]">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xl font-bold" id="detailTitle">Product</h3>
        <button id="closeDetail" class="text-gray-500 text-2xl">&times;</button>
      </div>
      <img id="detailImage" src="" alt="product" class="w-full h-48 rounded-xl object-cover mb-3">
      <div class="flex justify-between items-center">
        <span id="detailPrice" class="text-indigo-700 font-bold text-lg">0 ETB</span>
        <span id="detailCategory" class="bg-gray-200 px-3 py-0.5 rounded-full text-sm">Category</span>
      </div>
      <p id="detailDesc" class="text-gray-700 text-sm my-2">Description</p>
      <!-- rating & comment -->
      <div class="bg-gray-50 p-3 rounded-xl mt-2">
        <div class="flex items-center gap-2">
          <span class="text-sm font-medium">⭐ Rating:</span>
          <span id="detailRating" class="text-amber-500">★★★★★</span>
          <span class="text-xs text-gray-400">(4.2)</span>
        </div>
        <div class="flex items-center gap-2 mt-1">
          <i class="far fa-comment text-gray-500"></i>
          <span class="text-sm text-gray-600" id="detailComment">"Great for students!"</span>
        </div>
      </div>
      <!-- order button -->
      <button id="orderBtn" class="order-btn w-full text-white font-bold py-3 rounded-xl mt-4 shadow-md flex items-center justify-center gap-2">
        <i class="fab fa-telegram-plane"></i> Order via Telegram
      </button>
    </div>
  </div>

  <!-- ORDER FORM MODAL -->
  <div id="orderFormModal" class="fixed inset-0 z-[60] flex items-center justify-center modal-backdrop hidden">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 m-3 shadow-2xl">
      <h3 class="text-xl font-bold mb-2 flex items-center gap-2"><i class="fas fa-pen-fancy text-indigo-600"></i> Order Details</h3>
      <p class="text-sm text-gray-500 mb-3">Fill in your info to send order to @sky_dooper</p>
      <form id="orderForm" class="space-y-3">
        <input type="text" id="fullName" placeholder="Full Name" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" required>
        <input type="text" id="campusDorm" placeholder="Campus & Dorm Number (e.g. Lidege Dorm 12)" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" required>
        <input type="text" id="studentId" placeholder="Student ID (e.g. BDU/1234/12)" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" required>
        <input type="tel" id="phoneNumber" placeholder="Phone Number (e.g. 09XXXXXXXX)" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" required>
        <div class="flex gap-2 pt-1">
          <button type="submit" class="bg-indigo-600 text-white flex-1 py-2.5 rounded-xl font-bold">Send Order <i class="fas fa-paper-plane ml-1"></i></button>
          <button type="button" id="cancelOrderForm" class="bg-gray-200 px-5 rounded-xl">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL MODAL (password protected) -->
  <div id="adminModal" class="fixed inset-0 z-[70] flex items-center justify-center modal-backdrop hidden">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 m-2 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xl font-bold flex items-center gap-2"><i class="fas fa-lock text-amber-600"></i> Admin</h3>
        <button id="closeAdmin" class="text-gray-500 text-2xl">&times;</button>
      </div>
      <!-- password gate -->
      <div id="adminLoginGate" class="space-y-3">
        <input type="password" id="adminPassInput" placeholder="Enter password" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm">
        <button id="adminLoginBtn" class="bg-amber-600 w-full text-white py-2.5 rounded-xl font-bold">Unlock</button>
        <p id="adminPassError" class="text-red-500 text-xs hidden">Incorrect password</p>
      </div>
      <!-- admin panel content (hidden until auth) -->
      <div id="adminPanelContent" class="hidden space-y-3">
        <div class="flex items-center justify-between">
          <span class="font-semibold text-gray-700">Manage Products</span>
          <span class="admin-badge">protected</span>
        </div>
        <!-- product form -->
        <div class="bg-gray-50 p-3 rounded-2xl space-y-2">
          <input type="text" id="adminTitle" placeholder="Product Title" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
          <input type="text" id="adminPrice" placeholder="Price (ETB)" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
          <select id="adminCategory" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
            <option value="Educational">📚 Educational</option>
            <option value="Cosmetics">💄 Cosmetics</option>
            <option value="Electronics">📱 Electronics</option>
          </select>
          <textarea id="adminDesc" placeholder="Description" rows="2" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm"></textarea>
          <div class="flex gap-2">
            <input type="text" id="adminImageUrl" placeholder="Image URL" class="flex-1 border border-gray-300 rounded-xl px-3 py-2 text-sm">
            <label class="bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm cursor-pointer flex items-center gap-1">
              <i class="fas fa-upload"></i> <input type="file" id="adminImageFile" accept="image/*" class="hidden">
            </label>
          </div>
          <div class="flex gap-2">
            <button id="adminAddBtn" class="bg-indigo-600 text-white flex-1 py-2 rounded-xl font-bold text-sm">Add / Update</button>
            <button id="adminDeleteBtn" class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm">Delete</button>
          </div>
          <select id="adminProductSelect" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
            <option value="">— select product to edit/delete —</option>
          </select>
        </div>
        <p class="text-xs text-gray-400 text-center">Changes sync instantly.</p>
      </div>
    </div>
  </div>

  <script>
    (function(){
      // ---------- DATA ----------
      let products = [
        { id: 1, title: 'Calculus Textbook', price: 350, category: 'Educational', desc: 'New edition, essential for first-year engineering.', image: 'https://picsum.photos/seed/calc/300/300', rating: 4.2, comment: 'Clear explanations' },
        { id: 2, title: 'Lipstick Set', price: 280, category: 'Cosmetics', desc: 'Matte finish, 6 trendy colors.', image: 'https://picsum.photos/seed/lip/300/300', rating: 4.8, comment: 'Love the shades!' },
        { id: 3, title: 'Wireless Mouse', price: 450, category: 'Electronics', desc: 'Silent click, Bluetooth 5.0.', image: 'https://picsum.photos/seed/mouse/300/300', rating: 4.0, comment: 'Good battery life' },
        { id: 4, title: 'Physics Lab Manual', price: 210, category: 'Educational', desc: 'Practical experiments for second year.', image: 'https://picsum.photos/seed/phys/300/300', rating: 3.9, comment: 'Very useful' },
        { id: 5, title: 'Face Cream', price: 180, category: 'Cosmetics', desc: 'Moisturizing with SPF 30.', image: 'https://picsum.photos/seed/cream/300/300', rating: 4.5, comment: 'Great for dry skin' },
        { id: 6, title: 'USB-C Charger', price: 320, category: 'Electronics', desc: 'Fast charging 65W.', image: 'https://picsum.photos/seed/charger/300/300', rating: 4.1, comment: 'Works perfectly' }
      ];
      let nextId = 7;
      let selectedProductId = null; // for detail modal
      let currentLang = 'en'; // 'en' or 'am'

      // DOM refs
      const grid = document.getElementById('productGrid');
      const detailModal = document.getElementById('detailModal');
      const orderFormModal = document.getElementById('orderFormModal');
      const adminModal = document.getElementById('adminModal');

      // detail elements
      const detailTitle = document.getElementById('detailTitle');
      const detailImage = document.getElementById('detailImage');
      const detailPrice = document.getElementById('detailPrice');
      const detailCategory = document.getElementById('detailCategory');
      const detailDesc = document.getElementById('detailDesc');
      const detailRating = document.getElementById('detailRating');
      const detailComment = document.getElementById('detailComment');
      const orderBtn = document.getElementById('orderBtn');

      // order form
      const orderForm = document.getElementById('orderForm');
      const fullName = document.getElementById('fullName');
      const campusDorm = document.getElementById('campusDorm');
      const studentId = document.getElementById('studentId');
      const phoneNumber = document.getElementById('phoneNumber');

      // admin
      const adminLoginGate = document.getElementById('adminLoginGate');
      const adminPanelContent = document.getElementById('adminPanelContent');
      const adminPassInput = document.getElementById('adminPassInput');
      const adminLoginBtn = document.getElementById('adminLoginBtn');
      const adminPassError = document.getElementById('adminPassError');
      const adminProductSelect = document.getElementById('adminProductSelect');
      const adminTitle = document.getElementById('adminTitle');
      const adminPrice = document.getElementById('adminPrice');
      const adminCategory = document.getElementById('adminCategory');
      const adminDesc = document.getElementById('adminDesc');
      const adminImageUrl = document.getElementById('adminImageUrl');
      const adminImageFile = document.getElementById('adminImageFile');
      const adminAddBtn = document.getElementById('adminAddBtn');
      const adminDeleteBtn = document.getElementById('adminDeleteBtn');

      // language toggle
      const langToggle = document.getElementById('langToggle');
      const langLabel = document.getElementById('langLabel');
      const headerSub = document.getElementById('headerSub');

      // ---------- RENDER ----------
      function renderProducts(filter = 'all') {
        let filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
        grid.innerHTML = '';
        if (filtered.length === 0) {
          grid.innerHTML = '<div class="col-span-2 text-center text-gray-400 py-8">No products found</div>';
          return;
        }
        filtered.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 cursor-pointer';
          card.setAttribute('data-id', p.id);
          card.innerHTML = `
            <div class="relative">
              <img src="${p.image}" alt="${p.title}" class="w-full h-32 object-cover">
              <span class="absolute top-2 left-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full">${p.category}</span>
            </div>
            <div class="p-2.5">
              <h4 class="font-semibold text-sm truncate">${p.title}</h4>
              <div class="flex justify-between items-center mt-1">
                <span class="text-indigo-700 font-bold text-sm">${p.price} ETB</span>
                <span class="text-amber-400 text-xs">⭐ ${p.rating}</span>
              </div>
            </div>
          `;
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            openDetail(p.id);
          });
          grid.appendChild(card);
        });
        updateAdminSelect();
      }

      // ---------- DETAIL MODAL ----------
      function openDetail(id) {
        const p = products.find(pr => pr.id === id);
        if (!p) return;
        selectedProductId = p.id;
        detailTitle.textContent = p.title;
        detailImage.src = p.image;
        detailPrice.textContent = `${p.price} ETB`;
        detailCategory.textContent = p.category;
        detailDesc.textContent = p.desc;
        // rating stars
        const stars = '★'.repeat(Math.floor(p.rating)) + '☆'.repeat(5 - Math.floor(p.rating));
        detailRating.textContent = stars;
        detailComment.textContent = `"${p.comment || 'Great product!'}"`;
        detailModal.classList.remove('hidden');
      }

      function closeDetail() {
        detailModal.classList.add('hidden');
      }

      // ---------- ORDER FORM ----------
      function openOrderForm() {
        orderFormModal.classList.remove('hidden');
      }

      // submit order -> Telegram @sky_dooper
      function submitOrder(e) {
        e.preventDefault();
        const name = fullName.value.trim();
        const campus = campusDorm.value.trim();
        const sid = studentId.value.trim();
        const phone = phoneNumber.value.trim();
        if (!name || !campus || !sid || !phone) {
          alert('Please fill all fields.');
          return;
        }
        const product = products.find(p => p.id === selectedProductId);
        const productTitle = product ? product.title : 'Product';
        const msg = `📦 *New Order*%0A📌 Product: ${productTitle}%0A👤 Name: ${name}%0A🏫 Campus/Dorm: ${campus}%0A🆔 Student ID: ${sid}%0A📞 Phone: ${phone}`;
        const url = `https://t.me/sky_dooper?text=${msg}`;
        window.open(url, '_blank');
        orderFormModal.classList.add('hidden');
        orderForm.reset();
      }

      // ---------- ADMIN ----------
      function updateAdminSelect() {
        adminProductSelect.innerHTML = '<option value="">— select product to edit/delete —</option>';
        products.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `${p.title} (${p.price} ETB)`;
          adminProductSelect.appendChild(opt);
        });
      }

      function loadProductToAdmin(id) {
        const p = products.find(pr => pr.id === id);
        if (!p) return;
        adminTitle.value = p.title;
        adminPrice.value = p.price;
        adminCategory.value = p.category;
        adminDesc.value = p.desc;
        adminImageUrl.value = p.image;
      }

      function saveProductFromAdmin() {
        const title = adminTitle.value.trim();
        const price = parseFloat(adminPrice.value);
        const category = adminCategory.value;
        const desc = adminDesc.value.trim();
        const image = adminImageUrl.value.trim() || 'https://picsum.photos/seed/default/300/300';
        if (!title || isNaN(price) || price <= 0) {
          alert('Please enter valid title and price.');
          return;
        }
        const selectedId = adminProductSelect.value;
        if (selectedId) {
          // update existing
          const p = products.find(pr => pr.id == selectedId);
          if (p) {
            p.title = title;
            p.price = price;
            p.category = category;
            p.desc = desc;
            p.image = image;
          }
        } else {
          // add new
          products.push({
            id: nextId++,
            title,
            price,
            category,
            desc,
            image,
            rating: (4 + Math.random()).toFixed(1),
            comment: 'New item'
          });
        }
        renderProducts();
        updateAdminSelect();
        // reset form
        adminTitle.value = '';
        adminPrice.value = '';
        adminDesc.value = '';
        adminImageUrl.value = '';
        adminProductSelect.value = '';
        // close admin? keep open
      }

      function deleteProductFromAdmin() {
        const id = adminProductSelect.value;
        if (!id) return alert('Select a product to delete.');
        if (!confirm('Delete this product permanently?')) return;
        products = products.filter(p => p.id != id);
        renderProducts();
        updateAdminSelect();
        adminTitle.value = '';
        adminPrice.value = '';
        adminDesc.value = '';
        adminImageUrl.value = '';
        adminProductSelect.value = '';
      }

      // Admin password check
      function handleAdminLogin() {
        const pass = adminPassInput.value;
        if (pass === '281888$') {
          adminLoginGate.classList.add('hidden');
          adminPanelContent.classList.remove('hidden');
          adminPassError.classList.add('hidden');
          updateAdminSelect();
        } else {
          adminPassError.classList.remove('hidden');
        }
      }

      // ---------- LANGUAGE TOGGLE (EN/AM) ----------
      function toggleLanguage() {
        if (currentLang === 'en') {
          currentLang = 'am';
          langLabel.textContent = 'English';
          headerSub.textContent = 'ገበያ';
          document.documentElement.lang = 'am';
          document.documentElement.dir = 'rtl';
          // translate static headers 
          document.querySelector('#headerSub').textContent = 'ገበያ';
          // category buttons translation (simple)
          const catBtns = document.querySelectorAll('.cat-btn');
          if (catBtns.length >= 4) {
            catBtns[0].textContent = 'ሁሉም';
            catBtns[1].textContent = '📚 ትምህርታዊ';
            catBtns[2].textContent = '💄 መዋቢያ';
            catBtns[3].textContent = '📱 ኤሌክትሮኒክስ';
          }
          // product grid will re-render with english data (we keep data)
        } else {
          currentLang = 'en';
          langLabel.textContent = 'አማርኛ';
          headerSub.textContent = 'Market';
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
          const catBtns = document.querySelectorAll('.cat-btn');
          if (catBtns.length >= 4) {
            catBtns[0].textContent = 'All';
            catBtns[1].textContent = '📚 Educational';
            catBtns[2].textContent = '💄 Cosmetics';
            catBtns[3].textContent = '📱 Electronics';
          }
        }
        // re-render to reflect language? product data stays english, but we keep consistent
        renderProducts();
      }

      // ---------- EVENT BINDING ----------
      // Category filter
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('bg-indigo-600', 'text-white'));
          this.classList.add('bg-indigo-600', 'text-white');
          const cat = this.dataset.cat;
          renderProducts(cat);
        });
      });
      // default select all
      document.querySelector('.cat-btn[data-cat="all"]')?.classList.add('bg-indigo-600', 'text-white');

      // detail close
      document.getElementById('closeDetail').addEventListener('click', closeDetail);
      detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeDetail(); });

      // order button
      orderBtn.addEventListener('click', openOrderForm);
      document.getElementById('cancelOrderForm').addEventListener('click', () => {
        orderFormModal.classList.add('hidden');
        orderForm.reset();
      });
      orderForm.addEventListener('submit', submitOrder);

      // Admin
      document.getElementById('adminOpenBtn').addEventListener('click', () => {
        adminModal.classList.remove('hidden');
        adminPassInput.value = '';
        adminPassError.classList.add('hidden');
        // if already logged in, show panel
        if (!adminLoginGate.classList.contains('hidden')) {
          adminPanelContent.classList.add('hidden');
        } else {
          adminPanelContent.classList.remove('hidden');
          updateAdminSelect();
        }
      });
      document.getElementById('closeAdmin').addEventListener('click', () => {
        adminModal.classList.add('hidden');
      });
      adminLoginBtn.addEventListener('click', handleAdminLogin);
      adminPassInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAdminLogin(); });

      // admin select load
      adminProductSelect.addEventListener('change', function() {
        const val = this.value;
        if (val) loadProductToAdmin(parseInt(val));
        else { adminTitle.value = ''; adminPrice.value = ''; adminDesc.value = ''; adminImageUrl.value = ''; }
      });

      adminAddBtn.addEventListener('click', saveProductFromAdmin);
      adminDeleteBtn.addEventListener('click', deleteProductFromAdmin);

      // image file upload -> base64
      adminImageFile.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          adminImageUrl.value = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      // language toggle
      langToggle.addEventListener('click', toggleLanguage);

      // initial render
      renderProducts();

      // close modals on backdrop click
      adminModal.addEventListener('click', (e) => { if (e.target === adminModal) adminModal.classList.add('hidden'); });
      orderFormModal.addEventListener('click', (e) => { if (e.target === orderFormModal) orderFormModal.classList.add('hidden'); });

    })();
  </script>
</body>
</html>
