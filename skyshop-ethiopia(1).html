<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="BDU Market — marketplace for Bahir Dar University students">
<title>BDU Market</title>

<!-- Telegram Mini App SDK -->

<style>
:root{
  --primary:#0f766e;--primary2:#115e59;--accent:#f59e0b;
  --bg:#f5f7f8;--card:#fff;--text:#102a2a;--muted:#6b7c7c;
  --line:#e4e9e9;--danger:#dc2626;--success:#15803d;
  --shadow:0 10px 30px rgba(15,118,110,.08);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.app{max-width:720px;margin:auto;min-height:100vh;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,248,.94);backdrop-filter:blur(14px);padding:14px 16px 10px;border-bottom:1px solid rgba(228,233,233,.75)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#18a999);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:var(--shadow)}
.brand h1{font-size:18px;margin:0}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.search{margin-top:12px;position:relative}
.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 45px 0 15px;outline:none}
.search span{position:absolute;right:14px;top:12px;color:var(--muted)}
main{padding:16px 16px 96px}
.hero{border-radius:24px;padding:22px;background:linear-gradient(135deg,#0f766e,#134e4a);color:white;overflow:hidden;position:relative;margin-bottom:18px}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-50px;top:-55px;background:rgba(255,255,255,.10)}
.hero h2{margin:0 0 7px;font-size:25px;line-height:1.1;max-width:78%}
.hero p{margin:0;opacity:.86;font-size:13px;max-width:75%;line-height:1.5}
.hero .heroaction{margin-top:16px;background:white;color:var(--primary);padding:10px 14px;border-radius:12px;font-weight:800}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 11px}
.sectionhead h2{font-size:17px;margin:0}
.sectionhead button{background:none;color:var(--primary);font-weight:700;font-size:12px}
.cats{display:flex;gap:9px;overflow:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:10px 13px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#355050;font-weight:700;font-size:12px}
.cat.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.035)}
.picwrap{aspect-ratio:1/1;position:relative;background:#edf2f2}
.picwrap img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:9px;top:9px;background:rgba(255,255,255,.92);padding:5px 8px;border-radius:9px;font-size:10px;font-weight:800}
.cardbody{padding:11px}
.cardname{font-weight:800;font-size:14px;line-height:1.25;min-height:35px}
.price{font-weight:900;color:var(--primary);margin-top:6px}
.meta{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:10px;margin-top:5px}
.add{width:100%;margin-top:9px;background:var(--primary);color:white;border-radius:11px;padding:9px;font-weight:800}
.add:disabled{background:#aab7b7;cursor:not-allowed}
.bottomnav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 7px calc(8px + env(safe-area-inset-bottom))}
.navbtn{background:none;color:#789090;font-size:10px;font-weight:700;display:flex;flex-direction:column;gap:3px;align-items:center}
.navbtn b{font-size:19px;line-height:1}
.navbtn.active{color:var(--primary)}
.count{position:absolute;margin-left:17px;margin-top:-5px;background:var(--danger);color:#fff;border-radius:50%;font-size:9px;min-width:16px;height:16px;display:grid;place-items:center}
.page{min-height:60vh}
.detail{background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.detailimg{width:100%;aspect-ratio:1/1;object-fit:cover;background:#edf2f2}
.detailbody{padding:18px}
.back{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;margin-bottom:12px}
.stars{color:#f59e0b;letter-spacing:1px}
.detail h2{font-size:24px;margin:8px 0}
.detailprice{font-size:22px;font-weight:900;color:var(--primary)}
.desc{color:#5f7272;line-height:1.6;font-size:14px;white-space:pre-wrap}
.qty{display:flex;align-items:center;gap:12px;margin:15px 0}
.qty button{width:36px;height:36px;border-radius:11px;background:#edf4f3;font-size:20px}
.qty span{font-weight:900;min-width:20px;text-align:center}
.primary{background:var(--primary);color:#fff;padding:13px 16px;border-radius:13px;font-weight:900}
.secondary{background:#edf4f3;color:var(--primary2);padding:13px 16px;border-radius:13px;font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review{border-top:1px solid var(--line);padding:13px 0}
.reviewhead{display:flex;justify-content:space-between;font-size:12px;font-weight:800}
.review p{font-size:13px;color:#5f7272;margin:6px 0 0;line-height:1.45}
.form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;outline:none;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.summary{background:#f1f7f6;border-radius:15px;padding:13px;margin-bottom:15px}
.sumrow{display:flex;justify-content:space-between;font-size:13px;margin:5px 0}
.sumtotal{font-weight:900;font-size:17px;border-top:1px solid #dce8e6;padding-top:8px;margin-top:8px}
.empty{text-align:center;padding:45px 15px;color:var(--muted)}
.toast{position:fixed;z-index:100;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#173333;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:25px 25px 0 0;padding:18px 16px calc(25px + env(safe-area-inset-bottom))}
.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{margin:0;font-size:20px}
.close{width:36px;height:36px;border-radius:11px;background:#eef2f2}
.adminbar{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.adminbar button{white-space:nowrap;padding:9px 11px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800}
.adminbar button.active{background:var(--primary);color:#fff}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.stat strong{font-size:23px;display:block}
.stat span{font-size:11px;color:var(--muted)}
.adminlist{display:grid;gap:10px;margin-top:12px}
.adminitem{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;display:flex;gap:10px;align-items:center}
.adminitem img{width:56px;height:56px;border-radius:11px;object-fit:cover;background:#edf2f2}
.adminitemmain{flex:1;min-width:0}
.adminitemmain strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adminitemmain small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.adminactions{display:flex;gap:5px}
.adminactions button{padding:8px;border-radius:9px;background:#eef4f3;font-size:11px}
.adminactions .danger{color:var(--danger)}
.notice{padding:11px;border-radius:12px;background:#fff7df;color:#795d11;font-size:12px;line-height:1.5;margin-bottom:12px}
.filelabel{display:block;border:1px dashed #aabbbb;border-radius:13px;padding:18px;text-align:center;background:#fafcfc;color:#567;cursor:pointer}
.filelabel input{display:none}
.preview{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;margin-top:8px}
.ordercard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
.orderline{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin:5px 0}
.status{display:inline-block;padding:5px 8px;border-radius:8px;background:#edf4f3;color:var(--primary2);font-size:10px;font-weight:800}
.spinner{width:25px;height:25px;border:3px solid #d9e5e4;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.topactions{display:flex;gap:7px;align-items:center}
.admin-icon{background:#fff4df;border-color:#f0d39a}
.am{font-family:"Noto Sans Ethiopic",system-ui,sans-serif}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.statgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <div class="brand">
        <div class="logo">BDU</div>
        <div><h1>BDU Market</h1><small id="tagline">Campus marketplace</small></div>
      </div>
      <div class="topactions">
        <button class="iconbtn admin-icon" id="adminIconBtn" title="Admin">🔐</button>
        <button class="iconbtn" id="langBtn" title="Language">አማ</button>
      </div>
    </div>
    <div class="search">
      <input id="searchInput" placeholder="Search products..." autocomplete="off">
      <span>⌕</span>
    </div>
  </header>

  <main id="main"></main>

  <nav class="bottomnav">
    <button class="navbtn active" data-page="home"><b>⌂</b><span data-i18n="home">Home</span></button>
    <button class="navbtn" data-page="categories"><b>▦</b><span data-i18n="categories">Categories</span></button>
    <button class="navbtn" data-page="cart"><b>🛒<i class="count hidden" id="cartCount">0</i></b><span data-i18n="cart">Cart</span></button>
    <button class="navbtn" data-page="orders"><b>▤</b><span data-i18n="orders">Orders</span></button>
    <button class="navbtn" data-page="profile"><b>◉</b><span data-i18n="profile">Profile</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

function t(k){return T[state.lang][k] || T.en[k] || k}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return new Intl.NumberFormat("en-US").format(Number(n)||0)+" ETB"}
function nameOf(p){return state.lang==="am" ? (p.nameAm||p.nameEn||"") : (p.nameEn||p.nameAm||"")}
function descOf(p){return state.lang==="am" ? (p.descriptionAm||p.descriptionEn||"") : (p.descriptionEn||p.descriptionAm||"")}
function catName(c){return state.lang==="am" ? (c.nameAm||c.nameEn) : (c.nameEn||c.nameAm)}
function stars(r=0){let n=Math.round(Number(r)||0);return "★★★★★".split("").map((x,i)=>i<n?"★":"☆").join("")}
function showToast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove("show"),2500)}

function productMatches(p){
  const q=state.search.toLowerCase().trim();
  if(!p.active) return false;
  if(state.category && p.category!==state.category) return false;
  if(!q) return true;
  return [p.nameEn,p.nameAm,p.descriptionEn,p.descriptionAm,p.categoryName].join(" ").toLowerCase().includes(q);
}

async function seedDefaults(){
  if(!state.admin || !state.currentUser) return;
  const snap=await getDocs(collection(db,"categories"));
  if(snap.empty){
    const defaults=[
      {nameEn:"Educational Materials",nameAm:"የትምህርት እቃዎች",icon:"📚",active:true},
      {nameEn:"Cosmetics & Beauty",nameAm:"ኮስሜቲክስ እና ውበት",icon:"💄",active:true},
      {nameEn:"Electronics",nameAm:"ኤሌክትሮኒክስ",icon:"🎧",active:true},
      {nameEn:"Stationery",nameAm:"የጽሕፈት መሳሪያዎች",icon:"✏️",active:true},
      {nameEn:"Other",nameAm:"ሌሎች",icon:"🛍️",active:true}
    ];
    for(const c of defaults) await addDoc(collection(db,"categories"),{...c,createdAt:serverTimestamp()});
  }
}

function subscribeData(){
  onSnapshot(collection(db,"categories"),snap=>{
    state.categories=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },e=>console.warn("categories",e));

  onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),snap=>{
    state.products=snap.docs.map(d=>{
      const x=d.data(); return {id:d.id,...x,createdAtMs:x.createdAt?.toMillis?.()||0};
    });
    render();
  },async e=>{
    console.warn("products ordered query failed; retrying simple query",e);
    const s=await getDocs(collection(db,"products"));
    state.products=s.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });

  onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc"),limit(100)),snap=>{
    state.orders=snap.docs.map(d=>{const x=d.data();return{id:d.id,...x,createdAtMs:x.createdAt?.toMillis?.()||0}});
    render();
  },()=>{});
  onSnapshot(query(collection(db,"reviews"),orderBy("createdAt","desc"),limit(200)),snap=>{
    state.reviews=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },()=>{});
}

async function init(){
  render();
  subscribeData();
  try{
    if(!auth.currentUser) await signInAnonymously(auth);
  }catch(e){
    console.warn("Enable Anonymous Authentication in Firebase.",e);
  }
}

window.closeModal=closeModal;
window.detailQty=(d)=>{const el=document.getElementById("detailQty");let n=Math.max(1,Math.min(99,(Number(el.textContent)||1)+d));el.textContent=n};
window.addDetailCart=()=>{const n=Number(document.getElementById("detailQty")?.textContent||1);window.addToCart(state.selectedProduct.id,n);closeModal()};
window.buyDetail=()=>{const n=Number(document.getElementById("detailQty")?.textContent||1);window.addToCart(state.selectedProduct.id,n);closeModal();window.openCheckout()};
window.addToCart=(id,qty=1)=>{
  const p=state.products.find(x=>x.id===id);if(!p||Number(p.stock||0)<=0)return showToast(t("out"));
  const found=state.cart.find(x=>x.id===id);
  const max=Number(p.stock||99);
  if(found)found.qty=Math.min(max,found.qty+qty);else state.cart.push({id,qty:Math.min(max,qty)});
  saveCart();showToast("✓ "+t("add"));render();
};
window.changeQty=(id,d)=>{
  const x=state.cart.find(a=>a.id===id),p=state.products.find(a=>a.id===id);if(!x)return;
  x.qty=Math.max(0,Math.min(Number(p?.stock||99),x.qty+d));if(!x.qty)state.cart=state.cart.filter(a=>a.id!==id);saveCart();render();
};
window.removeCart=(id)=>{state.cart=state.cart.filter(x=>x.id!==id);saveCart();render()};
window.clearCart=()=>{state.cart=[];saveCart();render()};

    const orderNo="BDU-"+Date.now().toString(36).toUpperCase();
    const order={orderNo,ownerUid:auth.currentUser?.uid||"",telegramId:u?.id?String(u.id):"",telegramUsername:u?.username||customer.username.replace(/^@/,""),
      customer,items:items.map(x=>({id:x.p.id,name:nameOf(x.p),price:Number(x.p.price),qty:x.qty})),total,status:"pending",createdAt:serverTimestamp()};
    try{
      await addDoc(collection(db,"orders"),order);
      state.cart=[];saveCart();closeModal();setPage("orders");
      setModal(`<div class="modal"><div class="sheet"><div class="form" style="text-align:center"><div style="font-size:55px">🎉</div><h2>${t("orderPlaced")}</h2><p>${t("orderNo")}: <b>${orderNo}</b></p><p style="color:var(--muted)">Your order was saved. Contact the seller to confirm availability and payment/delivery.</p><button class="primary" style="width:100%;margin-bottom:8px" onclick="window.openSeller()">${t("contact")} @${SELLER_USERNAME}</button><button class="secondary" style="width:100%" onclick="window.closeModal()">${t("back")}</button></div></div></div>`);
    }catch(err){console.error(err);showToast(t("error"))}
  };
};

window.openAdminLogin=()=>{
  setModal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>🔐 ${t("adminLogin")}</h2><button class="close" onclick="window.closeModal()">×</button></div>
  <div class="notice">Owner access: enter the BDU Market admin password first. Firebase still verifies the administrator account before database changes are allowed.</div>
  <form id="ownerGateForm" class="form">
    <div class="field"><label>Admin password</label><input type="password" name="ownerPassword" autocomplete="current-password" required autofocus></div>
    <button class="primary" style="width:100%">🔓 Continue to Admin</button>
  </form></div></div>`);

  document.getElementById("ownerGateForm").onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    if(fd.get("ownerPassword")!==OWNER_ADMIN_PASSWORD){
      showToast(state.lang==="am"?"የአስተዳዳሪ ይለፍ ቃል ልክ አይደለም":"Incorrect admin password");
      return;
    }

    // Password is only the first gate. Do not trust it for Firestore authorization.
    if(state.admin){
      closeModal();
      state.page="admin";
      render();
      return;
    }

    setModal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>🛡️ Firebase Admin Verification</h2><button class="close" onclick="window.closeModal()">×</button></div>
    <div class="notice">Use the administrator email/password you created in Firebase Authentication. This second step protects the actual database and image uploads.</div>
    <form id="firebaseLoginForm" class="form">
      <div class="field"><label>${t("email")}</label><input type="email" name="email" required></div>
      <div class="field"><label>${t("password")}</label><input type="password" name="password" required></div>
      <button class="primary" style="width:100%">🔓 ${t("login")}</button>
    </form></div></div>`);

    document.getElementById("firebaseLoginForm").onsubmit=async ev=>{
      ev.preventDefault();
      const f=new FormData(ev.target);
      try{
        await signInWithEmailAndPassword(auth,f.get("email"),f.get("password"));
        closeModal();
        state.page="admin";
        render();
      }catch(err){
        console.error(err);
        showToast(t("loginFailed"));
      }
    };
  };
};
